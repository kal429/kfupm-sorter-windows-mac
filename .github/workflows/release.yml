# Makes a release: push a tag such as v1.0.0 (GitHub Desktop: History, right-click the
# commit, Create Tag, then Push). Builds the Windows installer and both Mac .dmg files and
# publishes them, so the "latest" download links always point to the newest version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KFUPM Sorter for Windows and Mac ${{ github.ref_name }}
          files: |
            out/KFUPM-Sorter-Windows-Setup.exe
            out/KFUPM-Sorter-macOS-AppleSilicon.dmg
            out/KFUPM-Sorter-macOS-Intel.dmg
          body: |
            ## Download

            - **Mac with Apple silicon (M1 or newer):** `KFUPM-Sorter-macOS-AppleSilicon.dmg`
            - **Mac with Intel:** `KFUPM-Sorter-macOS-Intel.dmg`
            - **Windows 10 / 11:** `KFUPM-Sorter-Windows-Setup.exe`

            **Mac:** open the .dmg and drag *KFUPM Sorter Desktop* into Applications. The first time, right-click the app and choose **Open** (it is not notarized by Apple yet; on macOS 15 use *System Settings › Privacy & Security › Open Anyway*).

            **Windows:** no administrator rights needed. If Windows shows "Windows protected your PC", click **More info** then **Run anyway** (the installer is not code-signed yet). If you already use the PowerShell edition ([kfupm-sorter-windows](https://github.com/kal429/kfupm-sorter-windows)), use one of them, not both.

            Java is included inside the app, so there is nothing else to install.

            ---
            **Mac:** افتح ملف .dmg المناسب لجهازك واسحب التطبيق إلى مجلد التطبيقات، وافتحه أول مرة بالنقر بالزر الأيمن ثم «فتح». **Windows:** شغّل KFUPM-Sorter-Windows-Setup.exe.
